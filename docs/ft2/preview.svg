<svg xmlns="http://www.w3.org/2000/svg" width="760" height="600" viewBox="0 0 760 600" role="img" aria-labelledby="title desc">
<title id="title">FT2 screen outcomes and adapter change magnitudes</title>
<desc id="desc">Update 327 had more correct GATE28 outcomes than update 128, but one extra answerable error reduced weighted PA. MLP matrices account for about 69 to 71 percent of squared weight-change norm; this does not establish causal importance.</desc>
<rect width="760" height="600" fill="#ffffff"/>
<g font-family="Arial, sans-serif" fill="#172033">
<text x="24" y="32" font-size="20">GATE28: answerable and unsupported outcomes</text>
<rect x="24" y="47" width="12" height="12" fill="#197a68"/>
<text x="43" y="58" font-size="14">Correct</text>
<rect x="170" y="47" width="12" height="12" fill="#ba3a46"/>
<text x="189" y="58" font-size="14">Wrong</text>
<rect x="300" y="47" width="12" height="12" fill="#a7b0bd"/>
<text x="319" y="58" font-size="14">Abstain</text>
<text x="24" y="105" font-size="14">Answerable u128</text>
<rect x="200" y="86" width="390.0" height="29" fill="#197a68"/>
<text x="395.0" y="106" text-anchor="middle" fill="white" font-size="14">15</text>
<rect x="590.0" y="86" width="52.0" height="29" fill="#ba3a46"/>
<text x="616.0" y="106" text-anchor="middle" fill="white" font-size="14">2</text>
<rect x="642.0" y="86" width="78.0" height="29" fill="#a7b0bd"/>
<text x="681.0" y="106" text-anchor="middle" fill="white" font-size="14">3</text>
<text x="24" y="156" font-size="14">Answerable u327</text>
<rect x="200" y="137" width="390.0" height="29" fill="#197a68"/>
<text x="395.0" y="157" text-anchor="middle" fill="white" font-size="14">15</text>
<rect x="590.0" y="137" width="78.0" height="29" fill="#ba3a46"/>
<text x="629.0" y="157" text-anchor="middle" fill="white" font-size="14">3</text>
<rect x="668.0" y="137" width="52.0" height="29" fill="#a7b0bd"/>
<text x="694.0" y="157" text-anchor="middle" fill="white" font-size="14">2</text>
<text x="24" y="207" font-size="14">Unsupported u128</text>
<rect x="200" y="188" width="390.0" height="29" fill="#197a68"/>
<text x="395.0" y="208" text-anchor="middle" fill="white" font-size="14">6</text>
<rect x="590.0" y="188" width="130.0" height="29" fill="#a7b0bd"/>
<text x="655.0" y="208" text-anchor="middle" fill="white" font-size="14">2</text>
<text x="24" y="258" font-size="14">Unsupported u327</text>
<rect x="200" y="239" width="520.0" height="29" fill="#197a68"/>
<text x="460.0" y="259" text-anchor="middle" fill="white" font-size="14">8</text>
<text x="24" y="302" font-size="13">Counts shown; each bar spans its own stratum (20 or 8 cases).</text>
<text x="24" y="324" font-size="13">Total correct 21 to 23; PA 0.653 to 0.610. Answerable cases carry 97.4% of PA.</text>
<text x="24" y="370" font-size="20">Adapter change: shares of squared Frobenius norm</text>
<rect x="24" y="388" width="12" height="12" fill="#197a68"/>
<text x="43" y="399" font-size="14">MLP</text>
<rect x="170" y="388" width="12" height="12" fill="#356bb5"/>
<text x="189" y="399" font-size="14">Linear attention</text>
<rect x="370" y="388" width="12" height="12" fill="#9b63b5"/>
<text x="389" y="399" font-size="14">Full attention</text>
<text x="24" y="439" font-size="14">u128: norm 7.848</text>
<rect x="200" y="420" width="359.84" height="29" fill="#197a68"/>
<text x="379.91999999999996" y="440" text-anchor="middle" fill="white" font-size="12">69.2%</text>
<rect x="559.8399999999999" y="420" width="124.8" height="29" fill="#356bb5"/>
<text x="622.2399999999999" y="440" text-anchor="middle" fill="white" font-size="12">24.0%</text>
<rect x="684.6399999999999" y="420" width="35.36" height="29" fill="#9b63b5"/>
<text x="702.3199999999998" y="440" text-anchor="middle" fill="white" font-size="12">6.8%</text>
<text x="24" y="490" font-size="14">u327: norm 9.255</text>
<rect x="200" y="471" width="369.2" height="29" fill="#197a68"/>
<text x="384.6" y="491" text-anchor="middle" fill="white" font-size="12">71.0%</text>
<rect x="569.2" y="471" width="118.56" height="29" fill="#356bb5"/>
<text x="628.48" y="491" text-anchor="middle" fill="white" font-size="12">22.8%</text>
<rect x="687.76" y="471" width="32.24" height="29" fill="#9b63b5"/>
<text x="703.88" y="491" text-anchor="middle" fill="white" font-size="12">6.2%</text>
<text x="24" y="540" font-size="13">Matrix sizes and scales differ. Norm shares do not measure causal importance.</text>
<text x="24" y="563" font-size="13">No internal activations or completed MLP/attention ablations were captured.</text>
</g></svg>